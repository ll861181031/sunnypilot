<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BYD car render</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="three.min.js"></script>
<script src="three-addons.js"></script>
<script src="meshopt-decoder.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var W = +(q.get('w') || 1800), H = +(q.get('h') || 1200);
  var view = q.get('view') || 'rear';
  var paint = q.get('paint') || '0f1013';
  var metal = +(q.get('metal') || 0.32);
  var rough = +(q.get('rough') || 0.42);
  var DEG = Math.PI / 180;

  var withShadow = q.get('shadow') !== '0';
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = withShadow;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 400);

  var pmrem = new THREE.PMREMGenerator(renderer);
  var envScene = new THREE.RoomEnvironment();
  var envRT = pmrem.fromScene(envScene, 0.03);
  scene.environment = envRT.texture;

  var key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(-1.8, 10, 2.4);
  key.castShadow = withShadow;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0005;
  key.shadow.normalBias = 0.02;
  key.shadow.camera.left = -7; key.shadow.camera.right = 7;
  key.shadow.camera.top = 7; key.shadow.camera.bottom = -7;
  key.shadow.camera.near = 0.5; key.shadow.camera.far = 40;
  scene.add(key);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3444, 0.35));
  var rim = new THREE.DirectionalLight(0xc8dcff, 1.3);
  rim.position.set(5, 4, -6);
  scene.add(rim);

  if (withShadow) {
    var catcher = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.22 }));
    catcher.rotation.x = -Math.PI / 2;
    catcher.receiveShadow = true;
    scene.add(catcher);
  }

  function sRGB(hex) {
    var c = new THREE.Color('#' + hex);
    if (THREE.ColorManagement && THREE.ColorManagement.enabled) return c;
    return c.convertSRGBToLinear();
  }

  var aim = new THREE.Vector3(0, 0.55, 0);
  var dims = null;

  function fitDistance(halfW, halfH, fovDeg, aspect, k) {
    var tv = Math.tan(fovDeg * Math.PI / 360);
    var dv = halfH / tv, dh = halfW / (tv * aspect);
    return Math.max(dv, dh) * (k || 1.15);
  }

  function applyView() {
    var az, el, fov, k, spanW, spanH;
    if (view === 'top') { az = 180; el = 72; fov = 26; k = 1.02; spanW = dims.hw; spanH = dims.hl; }
    else if (view === 'side') { az = 90; el = 8; fov = 26; k = 1.02; spanW = dims.hl; spanH = dims.h; }
    else { az = 172; el = 11; fov = 27; k = 0.86; spanW = dims.hw; spanH = dims.h; }
    if (q.get('az') != null) az = +q.get('az');
    if (q.get('el') != null) el = +q.get('el');
    if (q.get('fov') != null) fov = +q.get('fov');
    if (q.get('k') != null) k = +q.get('k');

    var a = az * DEG, e = el * DEG;
    var halfW = spanW, halfH = spanH;
    var d = fitDistance(halfW, halfH, fov, W / H, k);
    if (q.get('d') != null) d = +q.get('d');
    camera.fov = fov;
    camera.aspect = W / H;
    camera.position.set(
      aim.x + Math.sin(a) * Math.cos(e) * d,
      aim.y + Math.sin(e) * d,
      aim.z + Math.cos(a) * Math.cos(e) * d
    );
    camera.lookAt(aim);
    camera.updateProjectionMatrix();
  }

  function onLoad(gltf) {
    var model = gltf.scene;
    var c = (gltf.asset && gltf.asset.extras && gltf.asset.extras.d3car) || {};

    var assoc = gltf.parser && gltf.parser.associations;
    var byNode = new Map();
    if (assoc && assoc.forEach) {
      assoc.forEach(function (v, k) { if (v && v.nodes != null && !byNode.has(v.nodes)) byNode.set(v.nodes, k); });
    }
    (c.hide || []).forEach(function (i) {
      var o = byNode.get(i);
      if (o) o.visible = false;
    });

    model.rotation.set((c.rotX || 0) * DEG, (c.rotY || 0) * DEG, (c.rotZ || 0) * DEG, 'YXZ');

    var EXTERIOR = { 'Car_Paint': 1, 'M_Ext_Glass': 1, 'M_Ext_Wheel': 1, 'M_Ext_ChromePlastic': 1, 'M_Ext_Image': 1 };
    model.traverse(function (o) {
      if (!o.isMesh) return;
      var n = (o.material && o.material.name) || '';
      if (n === 'M_EngineBayCover' || n === 'M_EngineBayPanel' || n === 'M_PortBay') o.visible = false;
    });

    scene.add(model);
    model.updateMatrixWorld(true);

    var box = new THREE.Box3().setFromObject(model);
    var s = 4.774 / Math.max(1e-6, box.max.z - box.min.z);
    model.scale.setScalar(s);
    model.updateMatrixWorld(true);
    box.setFromObject(model);
    model.position.set(-(box.min.x + box.max.x) / 2, 0, -(box.min.z + box.max.z) / 2);
    model.updateMatrixWorld(true);

    var wheels = new THREE.Box3();
    model.traverse(function (o) {
      if (!o.isMesh) return;
      var n = (o.material && o.material.name) || (o.material && o.material[0] && o.material[0].name);
      if (n === 'M_Ext_Wheel') wheels.union(new THREE.Box3().setFromObject(o));
    });
    var groundY = wheels.isEmpty() ? 0 : wheels.min.y;
    model.position.y = -groundY;
    model.updateMatrixWorld(true);

    dims = { hw: 0.946, h: 1.68, hl: 2.387 };
    aim.set(0, 0.58, 0);

    var paintMat = new THREE.MeshPhysicalMaterial({
      color: sRGB(paint),
      metalness: metal,
      roughness: rough,
      clearcoat: 1.0,
      clearcoatRoughness: 0.035,
      envMapIntensity: 0.42
    });
    var paintExtra = new THREE.MeshPhysicalMaterial({
      color: sRGB(paint),
      metalness: metal,
      roughness: rough + 0.06,
      clearcoat: 0.8,
      clearcoatRoughness: 0.08,
      envMapIntensity: 0.34
    });
    var paintedMeshes = 0, matNames = {};
    model.traverse(function (o) {
      if (!o.isMesh) return;
      o.castShadow = true;
      o.receiveShadow = true;
      var mats = Array.isArray(o.material) ? o.material : [o.material];
      for (var i = 0; i < mats.length; i++) {
        if (!mats[i]) continue;
        var nm = mats[i].name || '(none)';
        matNames[nm] = (matNames[nm] || 0) + 1;
        if (nm === 'Car_Paint') {
          paintedMeshes++;
          if (Array.isArray(o.material)) o.material[i] = paintMat;
          else o.material = (String(o.name || '').indexOf('Bumper') >= 0) ? paintExtra : paintMat;
        }
      }
    });
    if (q.get('debug') != null) {
      var box2 = document.createElement('div');
      box2.style.cssText = 'position:fixed;top:0;left:0;background:#fff;color:#000;font:18px/1.4 monospace;padding:6px;z-index:9';
      box2.textContent = 'painted=' + paintedMeshes + ' paint=#' + paint + ' metal=' + metal + ' rough=' + rough +
        ' | ' + Object.keys(matNames).map(function (k) { return k + ':' + matNames[k]; }).join(', ');
      document.body.appendChild(box2);
    }

    applyView();
    renderer.render(scene, camera);
    window.__ready = true;
    document.title = 'READY ' + JSON.stringify({ hw: +dims.hw.toFixed(2), h: +dims.h.toFixed(2), hl: +dims.hl.toFixed(2), nodes: model.children.length });
  }

  window.__err = '';
  new THREE.GLTFLoader()
    .setMeshoptDecoder(window.MeshoptDecoder)
    .load('model.glb', onLoad, undefined, function (e) {
      window.__err = String(e && e.message ? e.message : e);
      document.title = 'ERR ' + window.__err;
      document.body.insertAdjacentHTML('beforeend', '<pre style="color:red">' + window.__err + '</pre>');
    });
})();
</script>
</body>
</html>
